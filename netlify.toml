[build]
  # --include=dev: keep TypeScript + Vite available when NODE_ENV=production
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback for React Router. force = false: real files in dist/ (e.g. /assets/*.js) are served first.
# Do not set VITE_BASE_PATH on Netlify unless the site is hosted in a subpath.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
