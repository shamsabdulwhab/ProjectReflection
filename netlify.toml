# Publish ONLY the Vite output folder (not the repo root).
# In the Netlify UI: Publish directory = dist (leave Build command empty OR match below).
[build]
  command = "rm -rf dist && npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback for React Router. force = false: real files in dist/ (e.g. /assets/*.js) are served first.
# Do not set VITE_BASE_PATH on Netlify unless the site is hosted in a subpath.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
